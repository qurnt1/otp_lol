  - region [ref=f2e106]:
    - generic [ref=f2e115]:
      - generic [ref=f2e116]: Transparent APIs
      - heading "Riot public data and local client events." [level=2] [ref=f2e117]
      - paragraph [ref=f2e118]: OTP LOL uses Riot Data Dragon for public League metadata like champions, icons, summoner spells, and version data. Runtime automation is driven by the local League Client Update interface on your own PC.
      - paragraph [ref=f2e119]: OTP LOL is not endorsed by Riot Games. It is a local Windows assistant for your own setup.

    - paragraph [ref=f2e30]: Designed by an OTP, for OTPs. OTP LOL helps automate queue and champion select actions while keeping everything local, transparent, and ad-free.
    - paragraph [ref=f2e31]: Created by a third-year data science student building the tool he wanted to use every day. Feedback and ideas are welcome.

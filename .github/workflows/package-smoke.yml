name: Package Windows smoke

on:
  push:
    branches:
      - main
      - codex/react-fastapi-webview-migration
    paths:
      - ".github/workflows/**"
      - "config/**"
      - "create_exe.py"
      - "frontend/**"
      - "installer/**"
      - "launcher_web.py"
      - "requirements*.txt"
      - "src/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "config/**"
      - "create_exe.py"
      - "frontend/**"
      - "installer/**"
      - "launcher_web.py"
      - "requirements*.txt"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-smoke:
    name: Build and self-test Windows package
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            requirements-constraints.txt

      - name: Install build dependencies
        run: python -m pip install -c requirements-constraints.txt -r requirements-build.txt

      - name: Build onedir distribution without desktop side effects
        shell: pwsh
        run: python create_exe.py --mode onedir --no-shortcut

      - name: Verify onedir distribution
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "OTP LOL\OTP LOL.exe" -PathType Leaf)) {
            throw "Expected onedir executable was not produced."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build and verify installer
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) { throw "Inno Setup compiler was not found." }
          $version = python -c "from src.config import CURRENT_VERSION; print(CURRENT_VERSION)"
          if ($LASTEXITCODE -ne 0) { throw "Could not read the application version." }
          & $iscc "/DAppVersion=$($version.Trim())" "/DBuildRoot=$(Get-Location)" "installer\OTP-LOL.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed." }
          $installerPath = "release\OTP-LOL-Setup.exe"
          if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
            throw "Expected installer executable was not produced."
          }
          $installer = Get-Item -LiteralPath $installerPath
          if ($installer.Length -le 0) { throw "Installer executable is empty." }
          $signature = [System.IO.File]::ReadAllBytes($installerPath)
          if ($signature.Length -lt 2 -or $signature[0] -ne 0x4D -or $signature[1] -ne 0x5A) {
            throw "Installer output does not have a Windows executable signature."
          }

      - name: Run packaged diagnostics without touching existing settings
        shell: pwsh
        run: |
          $profileRoot = Join-Path $env:RUNNER_TEMP "otp-lol-diagnostic-isolation"
          $roaming = Join-Path $profileRoot "Roaming"
          $localAppData = Join-Path $profileRoot "Local"
          $temp = Join-Path $profileRoot "Temp"
          $settingsDirectory = Join-Path $roaming "OTP LOL"
          $settingsPath = Join-Path $settingsDirectory "parameters.toml"
          New-Item -ItemType Directory -Path $settingsDirectory, $localAppData, $temp -Force | Out-Null
          $sentinel = "config_schema_version = 3`nuser_setting = `"preserve-me`"`n"
          $sentinelBytes = [System.Text.UTF8Encoding]::new($false).GetBytes($sentinel)
          [System.IO.File]::WriteAllBytes($settingsPath, $sentinelBytes)
          $expectedSettings = [Convert]::ToBase64String($sentinelBytes)
          $env:APPDATA = $roaming
          $env:LOCALAPPDATA = $localAppData
          $env:TEMP = $temp
          $env:TMP = $temp

          $smokes = @(
            @{ Name = "self-test"; Arguments = @("--self-test", "--allow-missing-webview2") },
            @{ Name = "headless-smoke"; Arguments = @("--headless-smoke") }
          )
          foreach ($smoke in $smokes) {
            $log = Join-Path $env:RUNNER_TEMP "otp-lol-$($smoke.Name).log"
            $arguments = $smoke.Arguments
            & ".\OTP LOL\OTP LOL.exe" @arguments 2>&1 | Tee-Object -FilePath $log
            $exitCode = $LASTEXITCODE
            "### Packaged $($smoke.Name) output" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            Get-Content -LiteralPath $log | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            if ($exitCode -ne 0) { throw "Packaged $($smoke.Name) failed with exit code $exitCode." }
            if ([Convert]::ToBase64String([System.IO.File]::ReadAllBytes($settingsPath)) -cne $expectedSettings) {
              throw "Packaged $($smoke.Name) changed the existing settings sentinel."
            }
          }

      - name: Upload package diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: OTP-LOL-package-smoke-diagnostics-${{ github.run_id }}
          path: |
            build/**
            dist/**
            OTP LOL/**
            release/**
          if-no-files-found: ignore

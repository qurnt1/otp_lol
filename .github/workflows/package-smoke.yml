name: Package Windows smoke

on:
  push:
    branches:
      - main
      - codex/react-fastapi-webview-migration
    paths:
      - ".github/workflows/**"
      - "config/**"
      - "create_exe.py"
      - "frontend/**"
      - "installer/**"
      - "launcher_web.py"
      - "requirements*.txt"
      - "src/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "config/**"
      - "create_exe.py"
      - "frontend/**"
      - "installer/**"
      - "launcher_web.py"
      - "requirements*.txt"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-smoke:
    name: Build and self-test Windows package
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            requirements-constraints.txt

      - name: Install build dependencies
        run: python -m pip install -c requirements-constraints.txt -r requirements-build.txt

      - name: Build onedir distribution without desktop side effects
        shell: pwsh
        run: python create_exe.py --mode onedir --no-shortcut

      - name: Verify onedir distribution
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "OTP LOL\OTP LOL.exe" -PathType Leaf)) {
            throw "Expected onedir executable was not produced."
          }

      - name: Run packaged self-test
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "otp-lol-self-test.log"
          & ".\OTP LOL\OTP LOL.exe" --self-test --allow-missing-webview2 2>&1 | Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE
          "### Packaged self-test output" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Get-Content -LiteralPath $log | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          if ($exitCode -ne 0) { throw "Packaged self-test failed with exit code $exitCode." }

      - name: Upload package diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: OTP-LOL-package-smoke-diagnostics-${{ github.run_id }}
          path: |
            build/**
            dist/**
            OTP LOL/**
          if-no-files-found: ignore

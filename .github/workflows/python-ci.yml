name: Python CI

on:
  push:
    paths:
      - "**/*.py"
      - "requirements*.txt"
      - ".github/workflows/python-ci.yml"
  pull_request:
    paths:
      - "**/*.py"
      - "requirements*.txt"
      - ".github/workflows/python-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.13 on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-constraints.txt

      - name: Install dependencies
        run: python -m pip install -c requirements-constraints.txt -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q launcher.py src tests create_exe.py

      - name: Run unittest suite
        run: python -m unittest discover -s tests -v

      - name: Install Ruff
        run: python -m pip install -c requirements-constraints.txt ruff

      - name: Ruff audit
        run: python -m ruff check launcher.py src tests create_exe.py --select E9,F --ignore F401,F541,F841 --output-format=github

name: Build tagged release candidate

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate tagged source
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-constraints.txt

      - name: Install dependencies
        run: python -m pip install -c requirements-constraints.txt -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q launcher.py src tests create_exe.py

      - name: Run unittest suite
        run: python -m unittest discover -s tests -v

  package:
    name: Package Windows executable
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            requirements-constraints.txt

      - name: Install build dependencies
        run: python -m pip install -c requirements-constraints.txt -r requirements-build.txt

      - name: Build executable without desktop side effects
        shell: pwsh
        run: |
          "n" | python create_exe.py

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "OTP LOL.exe" -PathType Leaf)) {
            throw "Expected OTP LOL.exe was not produced."
          }

      - name: Upload release candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: OTP-LOL-${{ github.ref_name }}
          path: OTP LOL.exe
          if-no-files-found: error

name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - "src/**/*.py"
      - "launcher_web.py"
      - "requirements*.txt"
      - "scripts/e2e/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "src/**/*.py"
      - "launcher_web.py"
      - "requirements*.txt"
      - "scripts/e2e/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-build:
    name: Frontend CI / Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python for OpenAPI generation
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-constraints.txt

      - name: Install Python dependencies
        run: python -m pip install -c requirements-constraints.txt -r requirements.txt

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check generated API types
        working-directory: frontend
        run: npm run api:check

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

  e2e-windows:
    name: Frontend CI / Playwright Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-constraints.txt
            scripts/e2e/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install -c requirements-constraints.txt -r requirements.txt
          python -m pip install -c requirements-constraints.txt -r scripts/e2e/requirements.txt

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production frontend for FastAPI
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium

      - name: Run browser smoke tests
        working-directory: frontend
        run: npx playwright test --workers=1

      - name: Run full-stack restart and LCU smoke
        working-directory: frontend
        run: npx playwright test --config ../scripts/e2e/playwright.config.mjs --workers=1

      - name: Run API-focused E2E suites
        working-directory: frontend
        run: npm run test:e2e:api

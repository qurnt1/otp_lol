name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - "src/**/*.py"
      - "launcher_web.py"
      - "requirements*.txt"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "src/**/*.py"
      - "launcher_web.py"
      - "requirements*.txt"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-build:
    name: Frontend CI / Unit and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python for OpenAPI generation
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            requirements-constraints.txt

      - name: Install Python dependencies
        run: python -m pip install -c requirements-constraints.txt -r requirements-test.txt

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test

      - name: Check generated API types
        working-directory: frontend
        run: npm run api:check

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

  e2e-windows:
    name: Frontend CI / Playwright Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium

      - name: Run browser smoke tests
        working-directory: frontend
        run: npm run test:e2e
